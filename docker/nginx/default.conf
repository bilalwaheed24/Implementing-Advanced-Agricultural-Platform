# `frontend` service (ADR-016): serves the dependency-free UI and is the single public
# entry point. Everything that is not a static asset is proxied to the internal api.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Matches the api's MAX_BODY_BYTES (2 MiB), so oversize bodies stop here.
    client_max_body_size 2m;

    root /usr/share/nginx/html;

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /verify.html {
        include /etc/nginx/snippets/security-headers.conf;
        try_files /verify.html =404;
    }

    location = /favicon.ico {
        include /etc/nginx/snippets/security-headers.conf;
        default_type image/svg+xml;
        alias /usr/share/nginx/html/assets/favicon.svg;
    }

    location /static/ {
        include /etc/nginx/snippets/security-headers.conf;
        alias /usr/share/nginx/html/;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the api trusts this header for rate limiting and audit
        # IPs, so a client-supplied X-Forwarded-For must not survive the hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
