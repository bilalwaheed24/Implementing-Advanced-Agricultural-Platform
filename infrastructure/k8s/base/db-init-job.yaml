# One-off per release: create missing tables and apply pending migrations, then exit.
# Retries until the db is ready; safe to re-run (both steps are idempotent). Production
# data is never seeded — the local overlay adds --seed for the DEMO/SIMULATION dataset.
# Re-run with:  kubectl -n absp delete job db-init && kubectl apply -k <overlay>
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: absp
  labels: { app: db-init, app.kubernetes.io/part-of: absp }
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: db-init, app.kubernetes.io/part-of: absp, absp/backend-client: "true" }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: db-init
          image: absp-api:1.0.0
          args: ["--no-serve"]
          envFrom:
            - configMapRef: { name: absp-config }
            - secretRef: { name: absp-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
