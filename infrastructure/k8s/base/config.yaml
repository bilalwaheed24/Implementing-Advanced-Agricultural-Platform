# Non-secret settings shared by the api and the seed Job. Secrets: see secret.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: absp-config
  namespace: absp
data:
  ENV: "production"
  DEMO_MODE: "false"
  API_PREFIX: "/api/v1"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://absp.example.org"
  AI_SERVICE_URL: "http://ai:8100"
  LEDGER_SERVICE_URL: "http://ledger:8200"
  DATA_DIR: "/app/data"
