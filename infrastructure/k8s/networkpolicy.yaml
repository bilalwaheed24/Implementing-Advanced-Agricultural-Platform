# Default-deny with explicit allows (Security.md §15).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: absp-default-deny
  namespace: absp
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: absp-api-allow
  namespace: absp
spec:
  podSelector:
    matchLabels:
      app: absp-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 5432
          protocol: TCP
    - to:      # DNS
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
