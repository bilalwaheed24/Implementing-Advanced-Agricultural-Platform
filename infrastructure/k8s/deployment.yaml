apiVersion: apps/v1
kind: Deployment
metadata:
  name: absp-api
  namespace: absp
  labels:
    app: absp-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: absp-api
  template:
    metadata:
      labels:
        app: absp-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: absp-api:latest       # replace with a registry digest reference in production
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: absp-config
            - secretRef:
                name: absp-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet: { path: /health/live, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 30
            periodSeconds: 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: absp-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: absp-config
  namespace: absp
data:
  ENV: "production"
  DEMO_MODE: "false"
  API_PREFIX: "/api/v1"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://absp.example.org"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: absp-data
  namespace: absp
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: absp-api
  namespace: absp
spec:
  selector:
    app: absp-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: absp-api
  namespace: absp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: absp-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: absp-api
  namespace: absp
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [absp.example.org]
      secretName: absp-tls
  rules:
    - host: absp.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: absp-api
                port:
                  number: 80
