name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Secret scan (offline)
        run: python3 scripts/secret_scan.py

      - name: Lint (ruff, if available; syntax check otherwise)
        run: |
          python3 -m py_compile $(find backend ai ledger iot scripts -name "*.py")
          for f in frontend/app.js frontend/verify.js frontend/assets/*.js frontend/views/*.js; do
            node --check "$f"
          done

      - name: SAST — Bandit
        run: |
          pip install bandit==1.8.0
          bandit -r backend/app ai ledger iot scripts -ll -f txt || \
            (echo "::warning::Bandit reported findings — see log above" && true)

      # Run Semgrep from PyPI rather than returntocorp/semgrep-action: that action was
      # pinned to a malformed 39-character SHA (a git SHA is 40), so the job failed at
      # "Set up job", and the action itself has not been updated since January 2024
      # (its successor semgrep/semgrep-action is archived). The CLI is maintained.
      - name: SAST — Semgrep
        continue-on-error: true
        run: |
          pip install semgrep==1.90.0
          semgrep scan --config p/security-audit --config p/python \
                       --config p/owasp-top-ten --error --metrics=off || \
            (echo "::warning::Semgrep reported findings — see log above" && true)

      - name: SCA — pip-audit
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements.txt --desc || \
            (echo "::warning::pip-audit reported findings — see log above" && true)

      - name: Unit and integration tests
        run: python3 -m pytest backend/tests/ -q --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: test-results.xml

  build-and-scan-image:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image
        run: docker build -t absp-api:ci .

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: absp-api:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Container scan — Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: absp-api:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

  iac-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkov (Terraform + Kubernetes + Dockerfile)
        uses: bridgecrewio/checkov-action@a8664e3a0549367977f0cda990a34311835c87c0 # v12.3123.0
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile,secrets
          quiet: true
          soft_fail: true
